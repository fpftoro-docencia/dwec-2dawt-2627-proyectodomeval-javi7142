# Integración continua: cada cambio que va a main se revisa antes de fusionarse.
# Paso 1 (sprint 1): calidad del código y tests unitarios, uno detrás de otro.
name: Integración continua

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El workflow solo necesita leer el código
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con la caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar las dependencias exactas de package-lock.json
        run: npm ci

      - name: Revisar el código con ESLint
        run: npm run lint

      - name: Revisar el formato con Prettier
        run: npm run format:check

  tests:
    name: Tests
    # Si la calidad falla, no se gastan minutos en los tests
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v7

      - name: Instalar Node.js 24 con la caché de npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar las dependencias exactas de package-lock.json
        run: npm ci

      - name: Pasar los tests unitarios y de integración
        run: npm test
